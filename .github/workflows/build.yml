name: APK bauen
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK vorbereiten
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: APK bauen und signieren
        run: |
          cd "$(dirname "$(find . -name build.py -not -path './.git/*' | head -n 1)")"
          mkdir -p .signing
          if [ -f signing/release.jks ] && [ -f signing/password ]; then
            cp signing/release.jks signing/password .signing/
          else
            PW=$(openssl rand -hex 16)
            printf '%s' "$PW" > .signing/password
            keytool -genkeypair -keystore .signing/release.jks -alias taskloop -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PW" -keypass "$PW" -dname "CN=TaskLoop, O=Andreas Pinzker, C=AT"
          fi
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          python3 build.py
          cp ../TaskLoop-2.3.apk "$GITHUB_WORKSPACE/TaskLoop-2.3.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: TaskLoop-APK
          path: TaskLoop-2.3.apk
